name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  qc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: QC-tester
        run: node --test tests/qc.test.mjs
